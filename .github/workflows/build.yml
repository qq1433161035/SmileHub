name: build

# Builds a debug and a release APK on every push so a usable artefact is
# always downloadable without tagging a release first.
#
# The release APK is signed with the same key the published versions use, so it
# installs over an existing app. Signing material lives in repository secrets;
# when they are absent the release build still runs but produces an unsigned
# APK, which is a legible outcome rather than a failed build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Chaquopy 在构建期需要一个 CPython 3.12 解释器
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The keystore is stored base64-encoded so it survives being pasted into a
      # secret. The properties file is composed here rather than committed.
      - name: Restore signing material
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set; the release APK will be unsigned"
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/smilehub.jks
          {
            echo "storeFile=keystore/smilehub.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release
        run: ./gradlew assembleRelease --no-daemon

      - name: Report signing state
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::release APK was not produced"
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            echo "produced: $APK"
            # apksigner exits non-zero on an unsigned APK, which is a fine
            # outcome here: it just means no signing secrets are configured.
            if apksigner verify "$APK" >/dev/null 2>&1; then
              echo "- \`$APK\` — signed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$APK is unsigned (signing secrets are not configured)"
              echo "- \`$APK\` — **unsigned**, cannot be installed until signed" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Bring artifact names up to date
        run: |
          # The name carries the version and short commit so several downloaded
          # builds stay distinguishable.
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          SHA=$(git rev-parse --short HEAD)
          shopt -s nullglob
          for APK in app/build/outputs/apk/debug/*.apk; do
            cp "$APK" "app/build/outputs/apk/debug/smilehub-${VERSION}-${SHA}-debug.apk"
          done
          for APK in app/build/outputs/apk/release/*.apk; do
            SUFFIX=""
            case "$APK" in *-unsigned.apk) SUFFIX="-unsigned";; esac
            cp "$APK" "app/build/outputs/apk/release/smilehub-${VERSION}-${SHA}-release${SUFFIX}.apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smilehub-debug
          path: app/build/outputs/apk/debug/smilehub-*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: smilehub-release
          path: app/build/outputs/apk/release/smilehub-*.apk
          if-no-files-found: error
